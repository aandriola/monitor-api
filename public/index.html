<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>monitor-api</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1c2230; --muted:#6b7280; --line:#e5e7eb;
            --ok:#15803d; --okbg:#dcfce7; --off:#b91c1c; --offbg:#fee2e2; --accent:#2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f141c; --card:#181f2b; --text:#e6e9ef; --muted:#97a0af; --line:#2a3342;
              --ok:#4ade80; --okbg:#14391f; --off:#f87171; --offbg:#3f1d1d; --accent:#60a5fa; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
    main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
    form { display: grid; grid-template-columns: 1fr 1fr 140px auto; gap: 10px; }
    input, button { font: inherit; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
                    background: var(--bg); color: var(--text); }
    button { background: var(--accent); color: #fff; border: 0; cursor: pointer; }
    button.small { padding: 5px 10px; font-size: .85rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; font-size: .85rem; }
    .wrap { overflow-x: auto; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; }
    .online { color: var(--ok); background: var(--okbg); }
    .offline { color: var(--off); background: var(--offbg); }
    .muted { color: var(--muted); }
    #msg { min-height: 1.4em; margin-top: 8px; color: var(--off); }
    @media (max-width: 640px) { form { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>monitor-api</h1>
  <p class="sub">Dispositivos cadastrados e o status calculado pelo último heartbeat. Atualiza a cada 5 segundos.</p>

  <section class="card">
    <form id="form">
      <input name="name" placeholder="Nome (ex.: Switch 1)" required maxlength="100">
      <input name="host" placeholder="Host/IP (ex.: 192.168.0.10)" required maxlength="255">
      <input name="type" placeholder="Tipo" maxlength="50">
      <button type="submit">Cadastrar</button>
    </form>
    <div id="msg" role="alert"></div>
  </section>

  <section class="card wrap">
    <table>
      <thead>
        <tr><th>ID</th><th>Nome</th><th>Host</th><th>Tipo</th><th>Status</th><th>Último heartbeat</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="muted" hidden>Nenhum dispositivo cadastrado ainda.</p>
  </section>
</main>

<script>
  const rows = document.getElementById('rows');
  const empty = document.getElementById('empty');
  const msg = document.getElementById('msg');

  async function api(path, options) {
    const res = await fetch(path, options);
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.message || body.error || res.statusText);
    return body;
  }

  function ago(iso) {
    if (!iso) return 'nunca';
    const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));
    if (s < 60) return 'há ' + s + ' s';
    if (s < 3600) return 'há ' + Math.round(s / 60) + ' min';
    return new Date(iso).toLocaleString('pt-BR');
  }

  function cell(text) {
    const td = document.createElement('td');
    td.textContent = text;
    return td;
  }

  function render(devices) {
    rows.replaceChildren();
    empty.hidden = devices.length > 0;
    for (const d of devices) {
      const tr = document.createElement('tr');
      tr.append(cell(d.id), cell(d.name), cell(d.host), cell(d.type));

      const status = document.createElement('td');
      const badge = document.createElement('span');
      badge.className = 'badge ' + d.status;
      badge.textContent = d.status;
      status.append(badge);
      tr.append(status, cell(ago(d.lastHeartbeatAt)));

      const action = document.createElement('td');
      const btn = document.createElement('button');
      btn.className = 'small';
      btn.textContent = 'Enviar heartbeat';
      btn.addEventListener('click', () => heartbeat(d.id));
      action.append(btn);
      tr.append(action);
      rows.append(tr);
    }
  }

  async function load() {
    try {
      render(await api('/devices'));
    } catch (err) {
      msg.textContent = 'Erro ao carregar: ' + err.message;
    }
  }

  async function heartbeat(id) {
    try {
      msg.textContent = '';
      await api('/devices/' + id + '/heartbeat', { method: 'POST' });
      await load();
    } catch (err) {
      msg.textContent = err.message;
    }
  }

  document.getElementById('form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const form = event.target;
    const data = Object.fromEntries(new FormData(form));
    if (!data.type) delete data.type;
    try {
      msg.textContent = '';
      await api('/devices', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      form.reset();
      await load();
    } catch (err) {
      msg.textContent = err.message;
    }
  });

  load();
  setInterval(load, 5000);
</script>
</body>
</html>
